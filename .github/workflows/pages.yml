name: pages

# Deploy this analysis repo's own dashboard to GitHub Pages from Actions.
# docs/ is fully self-contained: `lab-analysis repo-dashboard` writes
# docs/index.html AND stages every referenced figure under docs/figures/,
# so the page references assets docs-locally (figures/x.png) and renders
# identically under legacy /docs serving, this Actions _site, or file://.
# We do NOT regenerate the central registry board here.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble _site from self-contained docs/
        run: |
          mkdir -p _site
          if [ -d docs ]; then
            cp -r docs/. _site/
          else
            echo "no docs/ to publish" >&2; exit 1
          fi
      - uses: actions/configure-pages@v5
        # enablement:true turns Pages ON from the first workflow run, so a freshly
        # scaffolded analysis repo goes live with no manual `gh api .../pages` step.
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
